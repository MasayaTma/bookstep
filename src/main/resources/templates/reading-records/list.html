<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>読書記録 | BookStep</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main class="container page-shell">
    <div th:replace="~{fragments/messages :: messages}"></div>
    <div class="page-heading"><div><p class="eyebrow">READING JOURNAL</p><h1>読書記録</h1><p>読んだ時間と感想を新しい順に確認できます。</p></div><a class="button button-primary" th:href="@{/reading-records/new}">読書記録を追加</a></div>
    <div class="empty-state" th:if="${#lists.isEmpty(records)}"><div class="empty-icon" aria-hidden="true">＋</div><h2>最初の読書記録を残しましょう</h2><p>読んだ本と時間を選ぶだけで記録できます。</p><a class="button button-primary" th:href="@{/reading-records/new}">読書記録を追加</a></div>
    <div class="record-list record-list-page" th:unless="${#lists.isEmpty(records)}">
        <article class="record-item" th:each="record : ${records}">
            <div class="record-item-heading"><div><p class="eyebrow" th:text="${#temporals.format(record.readingDate, 'yyyy.MM.dd')}">日付</p><h2><a th:href="@{/books/{id}(id=${record.book.id})}" th:text="${record.book.title}">書籍</a></h2></div><strong th:text="|${record.readingMinutes}分|">30分</strong></div>
            <p class="book-meta" th:if="${record.startPage != null or record.endPage != null}"><span th:text="${record.startPage != null ? record.startPage + 'ページから' : '開始未設定'}">開始</span><span th:text="${record.endPage != null ? record.endPage + 'ページまで' : '終了未設定'}">終了</span></p>
            <p th:if="${record.reflection != null}" th:text="${record.reflection}">感想</p>
            <aside class="ai-comment" th:if="${record.aiComment != null}"><strong>AIからのコメント</strong><p th:text="${record.aiComment.comment}">AIコメント</p></aside>
            <div class="card-actions"><a class="button button-secondary button-small" th:href="@{/books/{id}(id=${record.book.id})}">書籍詳細</a><a class="text-link" th:href="@{/reading-records/{id}/edit(id=${record.id})}">編集</a></div>
        </article>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body></html>
