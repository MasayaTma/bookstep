<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${book.title + ' | BookStep'}">書籍詳細 | BookStep</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="container page-shell">
    <div th:replace="~{fragments/messages :: messages}"></div>
    <a class="back-link" th:href="@{/books}">← 書籍一覧へ</a>

    <article class="detail-card">
        <div class="detail-cover" aria-hidden="true">
            <span>BOOK<br>STEP</span>
        </div>
        <div class="detail-content">
            <div class="detail-topline">
                <span class="status-badge" th:classappend="|status-${#strings.toLowerCase(book.status.name())}|"
                      th:text="${book.status.displayName}">未読</span>
                <span class="book-date" th:text="|登録日 ${#temporals.format(book.createdAt, 'yyyy年M月d日')}|">登録日</span>
            </div>
            <p class="eyebrow" th:text="${book.category ?: 'UNCATEGORIZED'}">CATEGORY</p>
            <h1 th:text="${book.title}">書籍タイトル</h1>
            <p class="detail-author" th:text="${book.author ?: '著者未設定'}">著者名</p>

            <dl class="detail-list">
                <div>
                    <dt>総ページ数</dt>
                    <dd th:text="${book.totalPages != null ? book.totalPages + 'ページ' : '未設定'}">未設定</dd>
                </div>
                <div>
                    <dt>読み始めた日</dt>
                    <dd th:text="${book.startedDate != null ? #temporals.format(book.startedDate, 'yyyy年M月d日') : '未設定'}">未設定</dd>
                </div>
                <div>
                    <dt>読了日</dt>
                    <dd th:text="${book.completedDate != null ? #temporals.format(book.completedDate, 'yyyy年M月d日') : '未設定'}">未設定</dd>
                </div>
                <div>
                    <dt>累計読書時間</dt>
                    <dd th:text="|${totalReadingMinutes}分|">0分</dd>
                </div>
            </dl>

            <section class="memo-block">
                <h2>メモ</h2>
                <p th:if="${book.memo != null}" th:text="${book.memo}">メモ</p>
                <p class="muted" th:unless="${book.memo != null}">メモはまだありません。</p>
            </section>

            <div class="detail-actions">
                <a class="button button-primary" th:href="@{/books/{id}/reading-records/new(id=${book.id})}">読書記録を追加</a>
                <a class="button button-primary" th:href="@{/books/{id}/edit(id=${book.id})}">書籍情報を編集</a>
                <form method="post" th:action="@{/books/{id}/delete(id=${book.id})}"
                      onsubmit="return confirm('この書籍と関連する読書記録を削除します。よろしいですか？');">
                    <button class="button button-danger" type="submit">削除</button>
                </form>
            </div>

            <section class="memo-block record-section">
                <div class="section-title-row">
                    <h2>読書記録</h2>
                    <span th:text="|${#lists.size(readingRecords)}件|">0件</span>
                </div>
                <p class="muted" th:if="${#lists.isEmpty(readingRecords)}">読書記録はまだありません。</p>
                <div class="record-list" th:unless="${#lists.isEmpty(readingRecords)}">
                    <article class="record-item" th:each="record : ${readingRecords}">
                        <div class="record-item-heading">
                            <strong th:text="${#temporals.format(record.readingDate, 'yyyy年M月d日')}">読書日</strong>
                            <span th:text="|${record.readingMinutes}分|">30分</span>
                        </div>
                        <p class="book-meta" th:if="${record.startPage != null or record.endPage != null}">
                            <span th:text="${record.startPage != null ? record.startPage + 'ページから' : '開始ページ未設定'}">開始</span>
                            <span th:text="${record.endPage != null ? record.endPage + 'ページまで' : '終了ページ未設定'}">終了</span>
                        </p>
                        <p th:if="${record.reflection != null}" th:text="${record.reflection}">感想</p>
                        <aside class="ai-comment" th:if="${record.aiComment != null}"><strong>AIからのコメント</strong><p th:text="${record.aiComment.comment}">AIコメント</p></aside>
                        <div class="card-actions">
                            <form method="post" th:action="@{/reading-records/{id}/ai-comment(id=${record.id})}"><button class="text-link text-button" type="submit" th:text="${record.aiComment == null ? 'AIコメントを生成' : 'AIコメントを再生成'}">AIコメントを生成</button></form>
                            <a class="text-link" th:href="@{/reading-records/{id}/edit(id=${record.id})}">編集</a>
                            <form method="post" th:action="@{/reading-records/{id}/delete(id=${record.id})}"
                                  onsubmit="return confirm('この読書記録を削除します。よろしいですか？');">
                                <button class="text-button-danger" type="submit">削除</button>
                            </form>
                        </div>
                    </article>
                </div>
            </section>
        </div>
    </article>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
